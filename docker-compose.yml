name: detai20

# Fallback lab stack. It uses Vault dev mode (HTTP, in-memory storage) so the
# team can test the API while SV1's file-storage + TLS stack is pending.
# Do not use this stack for production or real data.

x-app-build: &app-build
  context: ./student2_project_windows
  dockerfile: Dockerfile

x-app-environment: &app-environment
  DATABASE_URL: "postgresql+psycopg://app_user:local_app_password@postgres:5432/encryption_db"
  USE_VAULT_DB_CREDS: "${USE_VAULT_DB_CREDS:-false}"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "encryption_db"
  DB_ROTATION_INTERVAL_SECONDS: "1800"
  API_KEY: "${API_KEY:-local-demo-api-key-change-me}"
  ADMIN_API_KEY: "${ADMIN_API_KEY:-local-demo-admin-key-change-me}"
  VAULT_ADDR: "http://vault:8200"
  VAULT_TRANSIT_MOUNT: "transit"
  VAULT_TRANSIT_KEY: "app-data-key"
  VAULT_DATABASE_MOUNT: "database"
  VAULT_DATABASE_CONNECTION: "postgres"
  VAULT_DATABASE_ROLE: "app-role"
  VAULT_APPROLE_NAME: "student2-app"
  VAULT_APPROLE_FILE: "/credentials/vault-credentials.json"

# Only the one-shot setup container gets the root token and DB admin password.
x-init-environment: &init-environment
  <<: *app-environment
  VAULT_SETUP_TOKEN: "root"
  VAULT_DEMO_TOKEN: "root"
  VAULT_DB_ADMIN_USER: "vault_admin"
  VAULT_DB_ADMIN_PASSWORD: "local_vault_admin_password"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "encryption_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "local_demo_postgres_password"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./student2_project_windows/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encryption_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.20
    command:
      - "server"
      - "-dev"
      - "-dev-root-token-id=root"
      - "-dev-listen-address=0.0.0.0:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: "root"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  vault-audit:
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault audit enable file file_path=/tmp/vault-audit.log || true
        vault audit list
    restart: "no"

  vault-init:
    build: *app-build
    image: detai20-api:local
    environment: *init-environment
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - approle:/credentials
    command: ["python", "scripts/setup_vault.py"]
    restart: "no"

  api:
    build: *app-build
    image: detai20-api:local
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - approle:/credentials
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  approle:
