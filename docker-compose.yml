name: detai20

# Fallback lab stack. It uses Vault dev mode (HTTP, in-memory storage) so the
# team can test the API while SV1's file-storage + TLS stack is pending.
# Do not use this stack for production or real data.

x-app-build: &app-build
  context: ./api
  dockerfile: Dockerfile

x-app-environment: &app-environment
  DATABASE_URL: "postgresql+psycopg://app_user:local_app_password@postgres:5432/encryption_db?sslmode=require"
  USE_VAULT_DB_CREDS: "${USE_VAULT_DB_CREDS:-false}"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "encryption_db"
  DB_SSLMODE: "require"
  DB_ROTATION_INTERVAL_SECONDS: "1800"
  DB_POOL_SIZE: "${DB_POOL_SIZE:-20}"
  DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-20}"
  # 0 keeps T08 honest. Set 120 (or higher) only when measuring configuration D'.
  DEK_CACHE_TTL_SECONDS: "${DEK_CACHE_TTL_SECONDS:-0}"
  DEK_CACHE_MAX_ENTRIES: "${DEK_CACHE_MAX_ENTRIES:-1024}"
  UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
  API_KEY: "${API_KEY:?API_KEY must be set in the environment or root .env}"
  ADMIN_API_KEY: "${ADMIN_API_KEY:?ADMIN_API_KEY must be set in the environment or root .env}"
  VAULT_ADDR: "http://vault:8200"
  VAULT_TRANSIT_MOUNT: "transit"
  VAULT_TRANSIT_KEY: "app-data-key"
  VAULT_DATABASE_MOUNT: "database"
  VAULT_DATABASE_CONNECTION: "postgres"
  VAULT_DATABASE_ROLE: "app-role"
  VAULT_APPROLE_NAME: "app"
  VAULT_APPROLE_FILE: "/credentials/vault-credentials.json"

# Only the one-shot setup container gets the root token and DB admin password.
x-init-environment: &init-environment
  <<: *app-environment
  VAULT_SETUP_TOKEN: "root"
  VAULT_DEMO_TOKEN: "root"
  VAULT_DB_ADMIN_USER: "vault_admin"
  VAULT_DB_ADMIN_PASSWORD: "local_vault_admin_password"
  VAULT_OPERATOR_APPROLE_NAME: "operator"
  VAULT_OPERATOR_FILE: "/operator/operator-credentials.json"

services:
  postgres:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/pgcerts/postgres.crt"
      - "-c"
      - "ssl_key_file=/pgcerts/postgres.key"
    depends_on:
      pgcerts:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: "encryption_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "local_demo_postgres_password"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgcerts:/pgcerts:ro
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encryption_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.20
    command:
      - "server"
      - "-dev"
      - "-dev-root-token-id=root"
      - "-dev-listen-address=0.0.0.0:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: "root"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  vault-audit:
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault audit enable file file_path=/tmp/vault-audit.log || true
        vault audit list
    restart: "no"

  vault-init:
    build: *app-build
    image: detai20-api:local
    environment: *init-environment
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - approle:/credentials
      - operator:/operator
    command: ["python", "scripts/setup_vault.py"]
    restart: "no"

  api:
    build: *app-build
    image: detai20-api:local
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - approle:/credentials
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Chép cert vào named volume với quyền 600 cho uid postgres (70).
  # Bind mount từ Windows không giữ được permission mà PostgreSQL đòi hỏi.
  pgcerts:
    image: alpine:3.20
    volumes:
      - ./infrastructure/certs/out:/src:ro
      - pgcerts:/dst
    command:
      - "sh"
      - "-c"
      - "cp /src/postgres.crt /src/postgres.key /dst/ && chmod 600 /dst/postgres.key && chown 70:70 /dst/postgres.key && chmod 644 /dst/postgres.crt"
    restart: "no"

  # TLS terminator cho T13: Vault 8200, API 8443, baseline 8444.
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8200:8200"
      - "8443:8443"
      - "8444:8444"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/certs/out:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
  pgcerts:
  approle:
  operator:
