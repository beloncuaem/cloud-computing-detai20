title = "Gitleaks config"

# A custom config replaces the bundled rules unless useDefault is enabled.
# Keep the default rule set and add only the allowlist below.
[extend]
useDefault = true

# Default Gitleaks rules stay enabled. This file only allowlists public
# local-lab placeholder values committed in sql/00-create-roles.sql,
# docker-compose.yml and the archived evidence files.
#
# The API key placeholders below are no longer read by the application: the API
# now requires API_KEY/ADMIN_API_KEY from the environment. The literals remain in
# Git history and in docs/evidence/*, so deleting these regexes would fail the
# gitleaks job. Rotate the lab keys and keep real values only in .env.
#
# Do not add real credentials here. If a real secret is ever detected, revoke
# and rotate it first, then remove it from history with a reviewed procedure.
[allowlist]
description = "Local-lab demo placeholders only"
regexes = [
  '''local_app_password''',
  '''local_vault_admin_password''',
  '''local_demo_postgres_password''',
  '''local-demo-api-key-change-me''',
  '''local-demo-admin-key-change-me''',
]
