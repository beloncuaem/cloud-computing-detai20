# TLS terminator cho stack lab (T13). Vault giữ HTTP nội bộ trong network
# Docker; ranh giới TLS nằm ở nginx. Biến thể production-intent dùng TLS
# native trong infrastructure/vault/config/vault.hcl.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Vault API/UI qua TLS (T13: curl -k https://localhost:8200/v1/sys/health)
server {
    listen 8200 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    location / {
        proxy_pass http://vault:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# API thật (envelope encryption) qua TLS — cấu hình D / D' / E
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Baseline plaintext qua TLS — cấu hình B / C.
# Dùng biến + resolver để nginx vẫn khởi động khi container baseline chưa chạy.
server {
    listen 8444 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $baseline_upstream baseline:8001;
        proxy_pass http://$baseline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}